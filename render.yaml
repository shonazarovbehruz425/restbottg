# Render Blueprint — BITTA Web Service'da hamma narsa
# backend (API + bot) + mini-app (/) + admin-panel (/admin) bitta URL'da.
# Ishlatish: Render Dashboard -> New -> Blueprint -> shu repo'ni tanlang.
# Secret qiymatlar (sync: false) ni Render deploy paytida so'raydi — kodga yozmang!
#
# Eskisi (3 alohida servis) kerak bo'lsa git tarixidan topiladi:
#   git log --oneline -- render.yaml

services:
  - type: web
    name: restoran-app
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Single-service build kaliti (admin-panel /admin/ base bilan build bo'ladi)
      - key: SINGLE_SERVICE
        value: 1
      # Frontend'lar API'ni shu serverning o'zidan chaqiradi (nisbiy yo'l)
      - key: VITE_API_URL
        value: /api
      - key: VITE_MINI_APP_URL
        value: /
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ORDERS_CHANNEL_ID
        sync: false
      - key: TELEGRAM_USERS_BACKUP_CHANNEL_ID
        sync: false
      # Deploy'dan keyin service URL chiqqach to'ldiring, masalan:
      # https://restoran-app.onrender.com
      - key: TELEGRAM_MINI_APP_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: BACKUP_INTERVAL_HOURS
        value: 24
    # ---- Persistent Disk (FAQAT pullik plan: Starter $7/oy+) ----
    # Free plan'da disk ishlamaydi — avval disksiz deploy qiling.
    # Keyin pullik planga o'tib, Dashboard -> restoran-app -> Disks -> Add disk:
    #   mountPath: /opt/render/project/src/backend/data
    #   sizeGB: 1
    # va Environment'ga qo'shing:
    #   DB_PATH=/opt/render/project/src/backend/data/restaurant.db
    #   UPLOADS_DIR=/opt/render/project/src/backend/data/uploads
    # (disksiz holatda ma'lumotlar har deploy'da o'chadi — backup kanal + forward-restore sug'urta)
